# ==========================================
# Render Infrastructure as Code (Blueprint)
# E-Courtier Sénégal Deployment Configuration
# ==========================================

services:
  # --- Backend Web Service (Spring Boot Docker) ---
  - type: web
    name: ecourtier-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ecourtier-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ecourtier-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ecourtier-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@ecourtier.sn
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: IA_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: IA_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_TIMEOUT_MS
        value: "4000"
      - key: ECOURTIER_CORS_ALLOWED_ORIGINS
        value: https://ecourtier-frontend.onrender.com

  # --- Frontend Static Site (Vite React PWA) ---
  - type: web
    name: ecourtier-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://ecourtier-backend.onrender.com https://ecourtier-backend-uz6e.onrender.com; connect-src 'self' https://ecourtier-backend.onrender.com wss://ecourtier-backend.onrender.com https://ecourtier-backend-uz6e.onrender.com wss://ecourtier-backend-uz6e.onrender.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' blob: https://my.matterport.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ecourtier-backend.onrender.com

databases:
  # --- Managed PostgreSQL Database ---
  - name: ecourtier-db
    databaseName: ecourtier_db
    user: ecourtier_user
    region: frankfurt
    plan: free
    postgresMajorVersion: "16"

