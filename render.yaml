# ==========================================
# Render Infrastructure as Code (Blueprint)
# E-Courtier Sénégal Deployment Configuration
# ==========================================

services:
  # --- Backend Web Service (Spring Boot Docker) ---
  - type: web
    name: ecourtier-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ecourtier-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ecourtier-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ecourtier-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@ecourtier.sn
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: IA_API_KEY
        sync: false
      - key: ECOURTIER_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: ecourtier-frontend
          property: url

  # --- Frontend Static Site (Vite React PWA) ---
  - type: web
    name: ecourtier-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    rootDir: frontend
    region: frankfurt
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ecourtier-backend
          property: url

databases:
  # --- Managed PostgreSQL Database ---
  - name: ecourtier-db
    databaseName: ecourtier_db
    user: ecourtier_user
    region: frankfurt
    plan: free
