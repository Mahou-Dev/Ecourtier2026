spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

ecourtier:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    issuer: ecourtier-api
    audience: ecourtier-client
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  auth:
    refresh-rate-limit:
      max-attempts: 20
      window-ms: 60000
  ia:
    enabled: ${IA_ENABLED:true}
    provider: ${AI_PROVIDER:${IA_PROVIDER:gemini}}
    fallback-provider: local
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      timeout-ms: 3500
  transactions:
    initialise-expiration: PT24H
    expiration-check-fixed-delay-ms: 3600000
  wave:
    webhook-secret: test-wave-webhook-secret-local-only
    stale-timeout: PT2M
    reconciliation-delay-ms: 3600000
  payment:
    provider: mock
    paytech:
      api-key: ""
      api-secret: ""
      env: test
      base-url: https://paytech.sn/api
      ipn-url: https://test.ecourtier.local/api/v1/webhooks/paytech
      success-url: https://test.ecourtier.local/dashboard?tab=transactions&payment=success
      cancel-url: https://test.ecourtier.local/dashboard?tab=transactions&payment=cancel
      target-payment: Wave
      zero-debit-guaranteed: false
