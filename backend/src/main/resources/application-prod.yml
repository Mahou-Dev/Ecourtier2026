spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

ecourtier:
  jwt:
    secret: ${JWT_SECRET:}
  ia:
    enabled: ${IA_ENABLED:true}
    provider: ${AI_PROVIDER:${IA_PROVIDER:gemini}}
    fallback-provider: local
    gemini:
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      timeout-ms: ${GEMINI_TIMEOUT_MS:4000}

logging:
  level:
    root: WARN
    com.ecourtier: INFO

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: ${ECOURTIER_TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|::1|0:0:0:0:0:0:0:1}
