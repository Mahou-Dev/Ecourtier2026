spring:
  application:
    name: ecourtier-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecourtier_db}
    username: ${SPRING_DATASOURCE_USERNAME:ecourtier_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ecourtier_secure_pass_2026}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: always

# JWT Security Configuration
ecourtier:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 3600000 # 1 hour (3600s * 1000)
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 86400s * 1000)
  ia:
    api-key: ${IA_API_KEY:}
    provider: ${IA_PROVIDER:gemini}
    base-url: ${IA_BASE_URL:}


# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
