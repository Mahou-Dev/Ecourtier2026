spring:
  application:
    name: ecourtier-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:${BACKEND_PORT:8080}}
  error:
    include-message: always

# JWT Security Configuration
ecourtier:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:ecourtier-api}
    audience: ${JWT_AUDIENCE:ecourtier-client}
    access-token-expiration-ms: 3600000 # 1 hour (3600s * 1000)
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 86400s * 1000)
  auth:
    refresh-rate-limit:
      max-attempts: ${AUTH_REFRESH_RATE_LIMIT_MAX:20}
      window-ms: ${AUTH_REFRESH_RATE_LIMIT_WINDOW_MS:60000}
  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@ecourtier.sn}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  ia:
    enabled: ${IA_ENABLED:true}
    provider: ${AI_PROVIDER:${IA_PROVIDER:gemini}}
    fallback-provider: local
    api-key: ${IA_API_KEY:}
    base-url: ${IA_BASE_URL:}
    gemini:
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      model: ${GEMINI_MODEL:gemini-flash-lite-latest}
      timeout-ms: ${GEMINI_TIMEOUT_MS:4000}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:700}
      temperature: ${GEMINI_TEMPERATURE:0.1}
  cors:
    allowed-origins: ${ECOURTIER_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
  rdv:
    rappel-cron: "${ECOURTIER_RDV_RAPPEL_CRON:0 0 9 * * *}"
  vente:
    acompte-pourcentage: ${ECOURTIER_VENTE_ACOMPTE_POURCENTAGE:10}
  transactions:
    initialise-expiration: ${TRANSACTION_INITIALISE_EXPIRATION:PT24H}
    expiration-check-fixed-delay-ms: ${TRANSACTION_EXPIRATION_CHECK_MS:60000}
  wave:
    webhook-secret: ${WAVE_WEBHOOK_SECRET:}
    stale-timeout: ${WAVE_STALE_TIMEOUT:PT2M}
    reconciliation-delay-ms: ${WAVE_RECONCILIATION_DELAY_MS:300000}
  payment:
    # Fournisseur actif : mock (simulation locale zéro débit par défaut) ou paytech (Sandbox uniquement, env=test)
    provider: ${PAYMENT_PROVIDER:mock}
    paytech:
      api-key: ${PAYTECH_API_KEY:}
      api-secret: ${PAYTECH_API_SECRET:}
      env: ${PAYTECH_ENV:test}
      base-url: ${PAYTECH_BASE_URL:https://paytech.sn/api}
      ipn-url: ${PAYTECH_IPN_URL:}
      refund-notif-url: ${PAYTECH_REFUND_NOTIF_URL:}
      success-url: ${PAYTECH_SUCCESS_URL:}
      cancel-url: ${PAYTECH_CANCEL_URL:}
      target-payment: ${PAYTECH_TARGET_PAYMENT:Wave}
      connect-timeout-ms: ${PAYTECH_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${PAYTECH_READ_TIMEOUT_MS:10000}
      # PayTech Sandbox (env=test) peut débiter 100 à 150 FCFA réels : false par défaut par sécurité.
      zero-debit-guaranteed: false


# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
