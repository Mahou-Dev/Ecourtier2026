spring:
  application:
    name: ecourtier-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: always

# JWT Security Configuration
ecourtier:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: 3600000 # 1 hour (3600s * 1000)
    refresh-token-expiration-ms: 604800000 # 7 days (7 * 86400s * 1000)
  admin:
    bootstrap:
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@ecourtier.sn}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  ia:
    api-key: ${IA_API_KEY:}
    provider: ${IA_PROVIDER:gemini}
    base-url: ${IA_BASE_URL:}
  cors:
    allowed-origins: ${ECOURTIER_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}


# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
