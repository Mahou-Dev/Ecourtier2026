<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>E-Courtier — La Recherche Immobilier Intelligente & Sécurisée au Sénégal</title>
    <meta name="description" content="Plateforme intelligente de recherche de logement au Sénégal (Dakar, Ziguinchor, Thiès, Saly). Assistant IA, annonces vérifiées et caution séquestre." />
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter (asynchronous non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    </noscript>

    <!-- Early API Prefetch for public property detail routes -->
    <script>
      (function() {
        var m = window.location.pathname.match(/^\/annonce\/([a-f0-9-]+)/i);
        if (m) {
          var id = m[1];
          window.__PREFETCHED_ANNONCE_ID__ = id;
          window.__PREFETCHED_ANNONCE_PROMISE__ = fetch('/api/v1/annonces/' + id, {
            headers: { 'Accept': 'application/json' }
          }).then(function(r) {
            if (r.ok) {
              return r.json().then(function(data) {
                return { status: r.status, ok: true, data: data };
              });
            } else {
              return { status: r.status, ok: false, data: null };
            }
          }).catch(function(err) {
            return { status: 0, ok: false, error: err ? (err.message || 'NetworkError') : 'NetworkError' };
          });
        }
      })();
    </script>
  </head>
  <body class="bg-sand-100 text-charcoal-800 font-body antialiased selection:bg-terracotta-200 selection:text-terracotta-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
