server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy (REV-04) :
    # - script-src 'self' (aucun unsafe-inline / unsafe-eval)
    # - style-src conserve 'unsafe-inline' pour styles dynamiques Framer Motion / React / Radix / Leaflet + Google Fonts
    # - add_header répété dans chaque bloc location (nginx n'hérite pas add_header quand un enfant redéfinit add_header)
    set $csp_policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com https://ecourtier-backend.onrender.com https://ecourtier-backend-uz6e.onrender.com http://localhost:* http://127.0.0.1:*; connect-src 'self' https://ecourtier-backend.onrender.com wss://ecourtier-backend.onrender.com https://ecourtier-backend-uz6e.onrender.com wss://ecourtier-backend-uz6e.onrender.com https://fonts.googleapis.com https://fonts.gstatic.com http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; frame-src 'self' blob: https://my.matterport.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'";

    # Security headers (hérités dans location / qui ne redéfinit pas add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_policy always;

    # Never cache HTML entrypoint or PWA service worker aggressively
    location ~* ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|prefetch-annonce\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri =404;
    }

    # Long cache for fingerprinted static assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri =404;
    }

    # SPA fallback for client-side React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
